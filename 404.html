<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Right 2 Creation</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/tab-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A0A0A;
      --accent:    #C4582A;
      --accent-lt: #E8673C;
      --accent-dk: #4A1A0A;
      --text:      #ffffff;
      --muted:     #9ca3af;
      --border:    rgba(255,255,255,0.07);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    /* ══════════════════════════════════════
       CUSTOM CURSOR
    ══════════════════════════════════════ */
    .cursor {
      position: fixed;
      width: 12px; height: 12px;
      background: var(--accent-lt);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s, width 0.2s, height 0.2s, opacity 0.2s;
      mix-blend-mode: screen;
    }
    .cursor-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1.5px solid rgba(232,103,60,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.12s ease-out, width 0.25s, height 0.25s, border-color 0.25s;
    }
    body:hover .cursor { opacity: 1; }

    /* ══════════════════════════════════════
       CANVAS PARTICLES
    ══════════════════════════════════════ */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ══════════════════════════════════════
       SCANLINES
    ══════════════════════════════════════ */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.06) 2px,
        rgba(0,0,0,0.06) 4px
      );
      animation: scanMove 8s linear infinite;
    }
    @keyframes scanMove {
      from { background-position: 0 0; }
      to   { background-position: 0 100vh; }
    }

    /* ══════════════════════════════════════
       GRID OVERLAY
    ══════════════════════════════════════ */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ══════════════════════════════════════
       AMBIENT ORBS
    ══════════════════════════════════════ */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(150px);
      pointer-events: none;
      z-index: 1;
      will-change: transform;
      animation: orbFloat 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(196,88,42,0.22), transparent 70%);
      top: -200px; left: -200px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 550px; height: 550px;
      background: radial-gradient(circle, rgba(74,26,10,0.5), transparent 70%);
      bottom: -150px; right: -150px;
      animation-delay: -9s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(232,103,60,0.1), transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -4s;
      animation-duration: 10s;
    }
    @keyframes orbFloat {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.1); }
    }

    /* ══════════════════════════════════════
       FLOATING CODE TAGS
    ══════════════════════════════════════ */
    .float-tags {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }
    .ftag {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(196,88,42,0.25);
      white-space: nowrap;
      animation: tagFloat linear infinite;
      will-change: transform, opacity;
    }
    @keyframes tagFloat {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { transform: translateY(-20vh) rotate(var(--rot)); opacity: 0; }
    }

    /* ══════════════════════════════════════
       NAVBAR
    ══════════════════════════════════════ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10,10,10,0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      text-decoration: none;
    }
    .nav-logo-img {
      height: 40px;
      width: auto;
      object-fit: contain;
      mix-blend-mode: screen;
      transition: opacity 0.2s;
    }
    .nav-logo:hover .nav-logo-img { opacity: 0.85; }
    @keyframes logoPulse {
      from { box-shadow: 0 0 15px rgba(196,88,42,0.3); }
      to   { box-shadow: 0 0 30px rgba(232,103,60,0.6); }
    }
    .nav-brand { display: flex; flex-direction: column; }
    .nav-brand-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }
    .nav-brand-sub {
      font-size: 0.55rem;
      color: var(--accent-lt);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .nav-back {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 0.45rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .nav-back:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
    }
    .nav-back-arrow { transition: transform 0.2s; }
    .nav-back:hover .nav-back-arrow { transform: translateX(-3px); }

    /* ══════════════════════════════════════
       PULSING RINGS (behind 404)
    ══════════════════════════════════════ */
    .rings {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      width: 600px; height: 600px;
      pointer-events: none;
      z-index: 4;
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(196,88,42,0.15);
      animation: ringPulse 4s ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: 1.3s; }
    .ring:nth-child(3) { animation-delay: 2.6s; }
    @keyframes ringPulse {
      0%   { transform: scale(0.2); opacity: 0.8; }
      100% { transform: scale(1);   opacity: 0; }
    }

    /* ══════════════════════════════════════
       MAIN CONTENT
    ══════════════════════════════════════ */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      user-select: none;
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(196,88,42,0.1);
      border: 1px solid rgba(196,88,42,0.25);
      color: var(--accent-lt);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.35rem 0.875rem;
      border-radius: 999px;
      margin-bottom: 2rem;
      font-family: 'JetBrains Mono', monospace;
      animation: fadeSlideDown 0.8s ease both;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-lt);
      animation: dotPulse 1.5s ease-in-out infinite;
      box-shadow: 0 0 8px var(--accent-lt);
    }
    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(0.5); opacity: 0.3; }
    }

    /* ── GLITCH 404 ── */
    .glitch-wrap {
      position: relative;
      margin-bottom: 0.5rem;
      animation: fadeSlideDown 0.9s 0.1s ease both;
    }
    .glitch {
      font-size: clamp(7rem, 22vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.08);
      position: relative;
      display: inline-block;
      animation: glitchMain 6s 1s infinite;
    }
    /* Gradient fill via ::before */
    .glitch::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-lt) 45%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      -webkit-text-stroke: 0;
    }
    /* Glitch layer 1 — red channel */
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: #ff4444;
      opacity: 0;
      -webkit-text-stroke: 0;
      animation: glitchR 6s 1s infinite;
      clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
    }
    /* Glitch layer 2 via .glitch-b */
    .glitch-b {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      font-size: clamp(7rem, 22vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #00d4ff;
      opacity: 0;
      animation: glitchB 6s 1s infinite;
      clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
      pointer-events: none;
    }
    @keyframes glitchMain {
      0%,79%,100% { transform: none; filter: none; }
      80%    { transform: skewX(-2deg); filter: brightness(1.1); }
      81%    { transform: none; }
      82%    { transform: skewX(1.5deg) translateX(-4px); }
      83%    { transform: none; }
      84%    { transform: skewX(-1deg) translateX(2px); }
      85%    { transform: none; }
    }
    @keyframes glitchR {
      0%,79%,100% { opacity: 0; transform: none; }
      80%  { opacity: 0.7; transform: translateX(-6px); }
      81%  { opacity: 0; }
      82%  { opacity: 0.5; transform: translateX(4px); }
      83%  { opacity: 0; }
      84%  { opacity: 0.6; transform: translateX(-3px); }
      85%  { opacity: 0; }
    }
    @keyframes glitchB {
      0%,79%,100% { opacity: 0; transform: none; }
      80%  { opacity: 0.6; transform: translateX(6px); }
      81%  { opacity: 0; }
      82%  { opacity: 0.4; transform: translateX(-4px); }
      83%  { opacity: 0; }
      84%  { opacity: 0.5; transform: translateX(2px); }
      85%  { opacity: 0; }
    }

    /* Glow shadow beneath 404 */
    .glow-shadow {
      width: clamp(180px, 40vw, 360px);
      height: 20px;
      background: radial-gradient(ellipse, rgba(196,88,42,0.5), transparent 70%);
      margin: 0 auto 2rem;
      filter: blur(10px);
      border-radius: 50%;
      animation: glowBreathe 3s ease-in-out infinite alternate;
    }
    @keyframes glowBreathe {
      from { opacity: 0.5; transform: scaleX(0.9); }
      to   { opacity: 1;   transform: scaleX(1.1); }
    }

    /* Divider */
    .divider {
      width: 56px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto 1.75rem;
      border-radius: 999px;
      animation: fadeSlideDown 1s 0.3s ease both;
    }

    /* Headline */
    .headline {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 0.875rem;
      animation: fadeSlideDown 1s 0.4s ease both;
    }

    /* Typewriter */
    .typewriter-wrap {
      font-size: clamp(0.88rem, 2.2vw, 1rem);
      color: var(--muted);
      line-height: 1.7;
      max-width: 440px;
      margin-bottom: 2.5rem;
      min-height: 3.5em;
      animation: fadeSlideDown 1s 0.5s ease both;
    }
    .typewriter-text { }
    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--accent-lt);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.875rem;
      justify-content: center;
      margin-bottom: 2.75rem;
      animation: fadeSlideDown 1s 0.65s ease both;
    }
    .btn-magnetic {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 0.85rem 1.875rem;
      border-radius: 12px;
      text-decoration: none;
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(.23,1,.32,1);
      will-change: transform;
    }
    .btn-primary-mag {
      background: linear-gradient(135deg, var(--accent), var(--accent-lt));
      color: white;
      box-shadow: 0 6px 30px rgba(196,88,42,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn-primary-mag::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-lt), #ff7a50);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn-primary-mag:hover::before { opacity: 1; }
    .btn-primary-mag:hover {
      box-shadow: 0 10px 40px rgba(232,103,60,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn-secondary-mag {
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-secondary-mag::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.05);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn-secondary-mag:hover::before { opacity: 1; }
    .btn-secondary-mag:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.2);
    }
    .btn-icon {
      position: relative;
      z-index: 1;
      transition: transform 0.2s;
    }
    .btn-primary-mag:hover .btn-icon { transform: translateX(-3px); }
    .btn-secondary-mag:hover .btn-icon { transform: scale(1.15); }
    .btn-label { position: relative; z-index: 1; }

    /* Quick links */
    .links-section {
      animation: fadeSlideDown 1s 0.8s ease both;
    }
    .links-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      margin-bottom: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .quick-link {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 0.35rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,0.025);
      transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .quick-link:hover {
      color: var(--accent-lt);
      border-color: rgba(196,88,42,0.4);
      background: rgba(196,88,42,0.07);
      transform: translateY(-2px);
    }

    /* ══════════════════════════════════════
       FOOTER
    ══════════════════════════════════════ */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0.875rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.18);
      border-top: 1px solid var(--border);
      background: rgba(10,10,10,0.6);
      backdrop-filter: blur(12px);
      font-family: 'JetBrains Mono', monospace;
      animation: fadeSlideUp 1s 1s ease both;
    }
    footer .accent-text { color: var(--accent-lt); }

    /* ══════════════════════════════════════
       SHARED ANIMATIONS
    ══════════════════════════════════════ */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════ */
    @media (max-width: 520px) {
      nav { padding: 0.9rem 1.25rem; }
      .rings { width: 340px; height: 340px; }
      .btn-row { flex-direction: column; width: 100%; max-width: 280px; }
      .btn-magnetic { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Custom cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- Background layers -->
  <canvas id="particles"></canvas>
  <div class="scanlines"></div>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Floating code tags -->
  <div class="float-tags" id="floatTags"></div>

  <!-- Navbar -->
  <nav>
    <a href="/" class="nav-logo">
      <img src="/logo.png" alt="Right 2 Creation Logo" class="nav-logo-img" />
      <div class="nav-brand">
        <span class="nav-brand-name">Right 2 Creation</span>
        <span class="nav-brand-sub">Creation is our rights</span>
      </div>
    </a>
    <a href="/" class="nav-back">
      <svg class="nav-back-arrow" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Home
    </a>
  </nav>

  <!-- Pulsing rings -->
  <div class="rings">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>

  <!-- Main -->
  <main>

    <!-- Glitch 404 -->
    <div class="glitch-wrap">
      <div class="glitch" data-text="404">404</div>
      <div class="glitch-b">404</div>
    </div>

    <div class="glow-shadow"></div>
    <div class="divider"></div>

    <h1 class="headline">Page Not Found</h1>

    <div class="typewriter-wrap">
      <span class="typewriter-text" id="typewriterText"></span><span class="cursor-blink"></span>
    </div>

    <div class="btn-row">
      <a href="/" class="btn-magnetic btn-primary-mag" id="btnHome">
        <svg class="btn-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        <span class="btn-label">Go Home</span>
      </a>
      <a href="/#contact" class="btn-magnetic btn-secondary-mag" id="btnContact">
        <svg class="btn-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
        </svg>
        <span class="btn-label">Contact Us</span>
      </a>
    </div>

    <div class="links-section">
      <p class="links-label">// navigate to</p>
      <div class="quick-links">
        <a href="/#about"    class="quick-link">About</a>
        <a href="/#services" class="quick-link">Services</a>
        <a href="/#products" class="quick-link">Products</a>
        <a href="/#contact"  class="quick-link">Contact</a>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <span>&copy; 2026</span>
    <span class="accent-text">Right 2 Creation</span>
    <span>&mdash; All rights reserved</span>
  </footer>

  <script>
    /* ══════════════════════════════════════
       CURSOR
    ══════════════════════════════════════ */
    const cursor = document.getElementById('cursor');
    const cursorRing = document.getElementById('cursorRing');
    let mx = -100, my = -100, rx = -100, ry = -100;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    function animCursor() {
      cursor.style.left = mx + 'px';
      cursor.style.top  = my + 'px';
      rx += (mx - rx) * 0.15;
      ry += (my - ry) * 0.15;
      cursorRing.style.left = rx + 'px';
      cursorRing.style.top  = ry + 'px';
      requestAnimationFrame(animCursor);
    }
    animCursor();
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.width = '20px';
        cursor.style.height = '20px';
        cursorRing.style.width = '56px';
        cursorRing.style.height = '56px';
        cursorRing.style.borderColor = 'rgba(232,103,60,0.8)';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.width = '12px';
        cursor.style.height = '12px';
        cursorRing.style.width = '36px';
        cursorRing.style.height = '36px';
        cursorRing.style.borderColor = 'rgba(232,103,60,0.5)';
      });
    });

    /* ══════════════════════════════════════
       CANVAS PARTICLES
    ══════════════════════════════════════ */
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    const NUM = 80;
    const particles = [];
    for (let i = 0; i < NUM; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.5 + 0.1,
      });
    }
    const LINK_DIST = 120;
    function drawParticles() {
      ctx.clearRect(0, 0, W, H);
      // Update
      particles.forEach(p => {
        p.x += p.vx + (mx - W/2) * 0.0003;
        p.y += p.vy + (my - H/2) * 0.0003;
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;
      });
      // Draw connections
      for (let i = 0; i < NUM; i++) {
        for (let j = i + 1; j < NUM; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d < LINK_DIST) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(196,88,42,${0.15 * (1 - d/LINK_DIST)})`;
            ctx.lineWidth = 0.5;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      // Draw dots
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(196,88,42,${p.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    /* ══════════════════════════════════════
       FLOATING CODE TAGS
    ══════════════════════════════════════ */
    const tags = [
      'ERR_404','undefined','null','void(0)','404',
      'NaN','false','error()','not_found','404',
      'missing','lost','0x404','page_void','null',
      '~null','catch(err)','throw 404','undefined','[];',
      'return 404','{}','404','void','console.error()',
    ];
    const container = document.getElementById('floatTags');
    tags.forEach((tag, i) => {
      const el = document.createElement('div');
      el.className = 'ftag';
      el.textContent = tag;
      const leftPct = Math.random() * 95;
      const dur = 18 + Math.random() * 20;
      const rot = (Math.random() - 0.5) * 20;
      el.style.cssText = `
        left: ${leftPct}%;
        --rot: ${rot}deg;
        animation-duration: ${dur}s;
        animation-delay: -${Math.random() * dur}s;
        opacity: ${0.1 + Math.random() * 0.2};
        font-size: ${0.55 + Math.random() * 0.25}rem;
      `;
      container.appendChild(el);
    });

    /* ══════════════════════════════════════
       TYPEWRITER
    ══════════════════════════════════════ */
    const messages = [
      "Looks like you wandered into the digital void.",
      "This URL doesn't exist. Let's get you back.",
      "// Error: page not found at this route.",
    ];
    let msgIdx = 0, charIdx = 0, deleting = false;
    const tw = document.getElementById('typewriterText');
    function typeStep() {
      const msg = messages[msgIdx];
      if (!deleting) {
        tw.textContent = msg.slice(0, ++charIdx);
        if (charIdx === msg.length) {
          deleting = true;
          setTimeout(typeStep, 2400);
          return;
        }
        setTimeout(typeStep, 42);
      } else {
        tw.textContent = msg.slice(0, --charIdx);
        if (charIdx === 0) {
          deleting = false;
          msgIdx = (msgIdx + 1) % messages.length;
          setTimeout(typeStep, 400);
          return;
        }
        setTimeout(typeStep, 22);
      }
    }
    setTimeout(typeStep, 1200);

    /* ══════════════════════════════════════
       MAGNETIC BUTTONS
    ══════════════════════════════════════ */
    document.querySelectorAll('.btn-magnetic').forEach(btn => {
      btn.addEventListener('mousemove', e => {
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top  + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        btn.style.transform = `translate(${dx * 0.28}px, ${dy * 0.28}px) scale(1.04)`;
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.transform = '';
      });
    });

    /* ══════════════════════════════════════
       MOUSE PARALLAX ON ORBS
    ══════════════════════════════════════ */
    const orbs = document.querySelectorAll('.orb');
    const strengths = [0.025, 0.04, 0.06];
    document.addEventListener('mousemove', e => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      orbs.forEach((orb, i) => {
        const dx = (e.clientX - cx) * strengths[i];
        const dy = (e.clientY - cy) * strengths[i];
        orb.style.transform = `translate(${dx}px, ${dy}px)`;
      });
    });
  </script>

</body>
</html>
